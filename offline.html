<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline — Supernova</title>
  <meta name="theme-color" content="#1b0b2b">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --cream: #fff5e1; --ink: #1b0b2b; --berry: #df1a5e; --gold: #ffc23d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--cream); color: var(--ink); font-family: 'Bricolage Grotesque', system-ui, sans-serif; text-align: center; }
    .card { max-width: 420px; padding: 2.5rem 1.75rem; background: #fff; border: 3px solid var(--ink); border-radius: 26px; box-shadow: 8px 8px 0 var(--berry); }
    img { width: 88px; height: 88px; rotate: -8deg; }
    h1 { margin: 1.25rem 0 0.5rem; font-size: 2rem; letter-spacing: -0.04em; line-height: 1; }
    h1 em { font-family: Georgia, serif; font-weight: 400; color: var(--berry); }
    p { margin: 0 0 1.5rem; color: #4e3b5e; font-family: system-ui, sans-serif; line-height: 1.5; }
    button { min-height: 50px; padding: 0 1.75rem; background: var(--berry); color: #fff; border: 3px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink); font: 700 1rem system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/icons/icon-192.png" alt="" width="88" height="88">
    <h1>No signal, <em>no wahala.</em></h1>
    <p>You're offline right now. Check your data or Wi-Fi and we'll pick up right where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
